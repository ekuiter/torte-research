<!DOCTYPE html>
<!--
  Interactive Filter Interface

  This page displays CSV tables with interactive multi-select dropdown filters for dynamic data exploration.

  @author Lennart Pape
  @author Elias Kuiter
  @date 2026-02-06
  @version 2.0.0
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Interactive Filter Interface</title>

  <!-- DataTables & Bootstrap CSS Styles-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />

</head>
<body>
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="mb-0">Interactive Filter Interface</h1>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
        <i class="icon-sun fa-solid fa-sun"></i>
        <i class="icon-moon fa-solid fa-moon"></i>
      </button>
    </div>

    <!-- First Table: Tools -->
    <h2>Tools</h2>
    <div class="active-filters">
      <strong>Active Filters:</strong>
      <div id="tools-filters-container" class="d-inline">
        <span class="text-muted">No filters applied</span>
      </div>
      <button id="tools-clear-filters" class="clear-all-btn" style="display: none;">Clear All</button>
    </div>
    <table id="toolsTable" class="table table-striped table-bordered" style="width:100%">
      <thead></thead>
    </table>

    <!-- Second Table: Dummy -->
    <h2 class="mt-5">Dummy</h2>
    <div class="active-filters">
      <strong>Active Filters:</strong>
      <div id="dummy-filters-container" class="d-inline">
        <span class="text-muted">No filters applied</span>
      </div>
      <button id="dummy-clear-filters" class="clear-all-btn" style="display: none;">Clear All</button>
    </div>
    <table id="dummyTable" class="table table-striped table-bordered" style="width:100%">
      <thead></thead>
    </table>
  </div>

  <!-- JS Libraries and Script-->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="script.js"></script>
  <script>
    // Initialize tables with different configurations
    // - skipColumns: columns with no filter dropdown
    // - exactMatchColumns: columns where filter matches the entire cell value
    // - commaSplitColumns: columns where cell values are split by comma for individual matching
    // - numericSortColumns: columns sorted numerically (descending) in the filter dropdown
    const toolsTable = new FilterTable({
      csvFile: 'tools.csv',
      tableSelector: '#toolsTable',
      filtersContainerSelector: '#tools-filters-container',
      clearButtonSelector: '#tools-clear-filters',
      pageLength: 5,
      skipColumns: ['Title', 'Key'],
      exactMatchColumns: ['Year'],
      commaSplitColumns: [],
      numericSortColumns: ['Year']
    });

    const dummyTable = new FilterTable({
      csvFile: 'dummy.csv',
      tableSelector: '#dummyTable',
      filtersContainerSelector: '#dummy-filters-container',
      clearButtonSelector: '#dummy-clear-filters',
      pageLength: 5,
      skipColumns: ['Title', 'Key'],
      exactMatchColumns: ['Year'],
      commaSplitColumns: [],
      numericSortColumns: ['Year']
    });
  </script>
</body>
</html>
